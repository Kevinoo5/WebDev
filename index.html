<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Home</title>
  </head>
  <body>
    <header class="header">
      <div class="header-links">
        <a class="header-link" href="index.html">Home</a>
        <a class="header-link" href="addPost.html">Add Post</a>
      </div>
      <div id="pfp">
        <a href="login.html"
          ><img src="https://placehold.net/default.svg" alt="Profile"
        /></a>
      </div>
    </header>
    <main>
      <div class="main-layout">
        <div></div>
        <section class="posts" aria-label="Posts">
          <article class="post">
            <header class="post-head">
              <span class="avatar"></span>
              <h2><time datetime="2026-09-01">Sep 1, 2026</time></h2>
            </header>
            <p class="post-text">I LOVE CHEEEEEEEEEEEESE!! 🧀🧀🧀🧀</p>
            <button class="like" type="button" aria-label="Like">👍</button>
          </article>

          <article class="post">
            <header class="post-head">
              <span class="avatar"></span>
              <h2><time datetime="2026-08-13">Aug 13, 2026</time></h2>
            </header>
            <p class="post-text">I am stuck in a well, please let me out 👺</p>
            <button class="like" type="button" aria-label="Like">👍</button>
          </article>

          <article class="post">
            <header class="post-head">
              <span class="avatar"></span>
              <h2><time datetime="2026-06-17">Jun 17, 2026</time></h2>
            </header>
            <p class="post-text">Let's go gambling! 🤑🤑🤑</p>
            <button class="like" type="button" aria-label="Like">👍</button>
          </article>

          <article class="post">
            <header class="post-head">
              <span class="avatar"></span>
              <h2><time datetime="2010-03-31">Mar 32, 2010</time></h2>
            </header>
            <p class="post-text">
              Anyone knows in which room the lab is today?
            </p>
            <button class="like" type="button" aria-label="Like">👍</button>
          </article>

          <article class="post">
            <header class="post-head">
              <span class="avatar"></span>
              <h2><time datetime="1582-12-24">Dec 24, 1582</time></h2>
            </header>
            <p class="post-text">Sleep time! 🛏️😴😴</p>
            <button class="like" type="button" aria-label="Like">👍</button>
          </article>
        </section>
        <div></div>
      </div>
    </main>
    <footer>Footer</footer>
  </body>
</html>
